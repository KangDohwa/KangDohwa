<svg xmlns="http://www.w3.org/2000/svg" width="394" height="190" viewBox="0 0 394 190" role="img" aria-labelledby="languages-title languages-desc">
  <title id="languages-title">KangDohwa most used languages</title>
  <desc id="languages-desc">Language distribution by bytes across personal repositories and organizations owned by KangDohwa.</desc>
  <defs><style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .card { fill: #ffffff; stroke: #e2e8f0; }
      .title { fill: #0f172a; font-weight: 700; }
      .subtitle, .label { fill: #64748b; }
      .value, .language { fill: #1e293b; font-weight: 600; }
      .track { fill: #e2e8f0; }
      @media (prefers-color-scheme: dark) {
        .card { fill: #0d1117; stroke: #30363d; }
        .title { fill: #f0f6fc; }
        .subtitle, .label { fill: #8b949e; }
        .value, .language { fill: #c9d1d9; }
        .track { fill: #30363d; }
      }
    </style></defs>
  <rect class="card" x="0.5" y="0.5" width="393" height="189" rx="12"/>
  <text class="title" x="24" y="34" font-size="19">Most Used Languages</text>
  <text class="subtitle" x="24" y="55" font-size="11">Personal repositories + 7 owner organizations</text>
  <rect class="track" x="154" y="65" width="150" height="8" rx="4"/><rect x="154" y="65" width="84.6" height="8" rx="4" fill="#DA5B0B"/><circle cx="28" cy="73" r="5" fill="#DA5B0B"/><text class="language" x="42" y="77" font-size="13">Jupyter Notebook</text><text class="label" x="366" y="77" font-size="12" text-anchor="end">56.4%</text><rect class="track" x="154" y="86" width="150" height="8" rx="4"/><rect x="154" y="86" width="52.8" height="8" rx="4" fill="#178600"/><circle cx="28" cy="94" r="5" fill="#178600"/><text class="language" x="42" y="98" font-size="13">C#</text><text class="label" x="366" y="98" font-size="12" text-anchor="end">35.2%</text><rect class="track" x="154" y="107" width="150" height="8" rx="4"/><rect x="154" y="107" width="5.1" height="8" rx="4" fill="#dea584"/><circle cx="28" cy="115" r="5" fill="#dea584"/><text class="language" x="42" y="119" font-size="13">Rust</text><text class="label" x="366" y="119" font-size="12" text-anchor="end">3.4%</text><rect class="track" x="154" y="128" width="150" height="8" rx="4"/><rect x="154" y="128" width="3.1" height="8" rx="4" fill="#3572A5"/><circle cx="28" cy="136" r="5" fill="#3572A5"/><text class="language" x="42" y="140" font-size="13">Python</text><text class="label" x="366" y="140" font-size="12" text-anchor="end">2.1%</text><rect class="track" x="154" y="149" width="150" height="8" rx="4"/><rect x="154" y="149" width="1.2" height="8" rx="4" fill="#f34b7d"/><circle cx="28" cy="157" r="5" fill="#f34b7d"/><text class="language" x="42" y="161" font-size="13">C++</text><text class="label" x="366" y="161" font-size="12" text-anchor="end">0.8%</text><rect class="track" x="154" y="170" width="150" height="8" rx="4"/><rect x="154" y="170" width="1.2" height="8" rx="4" fill="#e34c26"/><circle cx="28" cy="178" r="5" fill="#e34c26"/><text class="language" x="42" y="182" font-size="13">HTML</text><text class="label" x="366" y="182" font-size="12" text-anchor="end">0.8%</text>
